<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI & MCP Day — Post-Event Survey</title>
<style>
:root{
  --navy:#104B88; --midnight:#0C122E; --blue:#00ADEF; --teal:#0D5D70;
  --turquoise:#04AEB1; --jungle:#0E404C; --slate:#32515B; --logo-orange:#FB7C32;
  --gold:#F9A425; --orange:#F15E22; --alert:#CB2626; --ink:#4F565C;
  --grey:#A7ACB0; --outline:#E3E5E4; --light-bg:#F1F3F3; --digital:#F9FBFB;
  --green:#1AB92D; --purple:#A54C96;
  --radius:14px;
  --shadow:0 1px 2px rgba(12,18,46,.05), 0 10px 30px rgba(12,18,46,.07);
  --font:"Inter","Helvetica Neue",Helvetica,Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); color:var(--ink); background:var(--digital);
  -webkit-font-smoothing:antialiased; min-height:100vh;
  display:flex; flex-direction:column;
}
body::before{
  content:""; position:fixed; inset:0 0 auto 0; height:320px; z-index:0;
  background:linear-gradient(160deg,var(--midnight) 0%,var(--jungle) 55%,var(--teal) 100%);
}
header{position:relative; z-index:1; padding:26px 16px 0; }
.head-inner{max-width:760px; margin:0 auto; display:flex; align-items:center; gap:14px}
.logo{width:36px; height:40px; flex:none; display:block}
/* keep the mark's own teal/orange; only the navy dot would vanish on the dark header */
.logo circle{fill:#FFFFFF !important}
.brand{color:#fff; line-height:1.25}
.brand .ev{font-size:17px; font-weight:650; letter-spacing:-.01em}
.brand .kind{font-size:12.5px; opacity:.72; letter-spacing:.06em; text-transform:uppercase; font-weight:600}
header.big{padding-top:38px}
header.big .head-inner{gap:20px}
header.big .logo{width:54px; height:60px}
header.big .brand .ev{font-size:26px}
header.big .brand .kind{font-size:14px; letter-spacing:.07em}
main{position:relative; z-index:1; flex:1; padding:22px 16px 40px; display:flex; flex-direction:column}
.card{
  max-width:760px; width:100%; margin:0 auto; background:#fff; border-radius:var(--radius);
  box-shadow:var(--shadow); border:1px solid var(--outline); overflow:hidden;
  display:flex; flex-direction:column; flex:1;
}
.bar{height:4px; background:var(--light-bg); position:relative; flex:none}
.bar i{position:absolute; inset:0 auto 0 0; width:0%; background:linear-gradient(90deg,var(--turquoise),var(--blue)); transition:width .35s cubic-bezier(.4,0,.2,1)}
.body{padding:34px 34px 10px; flex:1}
.step{font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--turquoise); margin:0 0 12px}
h1{font-size:25px; line-height:1.3; font-weight:650; letter-spacing:-.02em; color:var(--midnight); margin:0 0 6px}
.sub{font-size:14.5px; color:var(--grey); margin:0 0 22px}
.opts{display:flex; flex-direction:column; gap:9px; margin:22px 0 0}
.opts.cols{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:9px}
.opt{
  display:flex; align-items:flex-start; gap:13px; width:100%; text-align:left;
  padding:14px 16px; border:1.5px solid var(--outline); background:#fff;
  border-radius:11px; cursor:pointer; font:inherit; font-size:15.5px; color:var(--ink);
  transition:border-color .15s, background .15s, box-shadow .15s; line-height:1.45;
}
.opt:hover{border-color:var(--turquoise); background:#F6FCFC}
.opt:focus-visible{outline:3px solid rgba(0,173,239,.35); outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--teal); background:#F2F9FA; box-shadow:inset 0 0 0 1px var(--teal)}
.badge{
  flex:none; width:26px; height:26px; border-radius:7px; background:var(--light-bg);
  color:var(--slate); font-size:13px; font-weight:700; display:grid; place-items:center; margin-top:-1px;
}
.opt[aria-pressed="true"] .badge{background:var(--teal); color:#fff}
.tick{flex:none; width:22px; height:22px; border-radius:6px; border:1.5px solid var(--outline); display:grid; place-items:center; margin-top:0}
.opt[aria-pressed="true"] .tick{background:var(--teal); border-color:var(--teal)}
.tick svg{width:12px; height:12px; opacity:0}
.opt[aria-pressed="true"] .tick svg{opacity:1}
.scalewrap{margin:26px 0 0}
.scale{display:flex; gap:10px}
.scale button{
  flex:1; aspect-ratio:1/1; max-height:82px; border:1.5px solid var(--outline); background:#fff;
  border-radius:12px; font:inherit; font-size:21px; font-weight:650; color:var(--slate); cursor:pointer;
  transition:border-color .15s, background .15s, color .15s, transform .12s;
}
.scale button:hover{border-color:var(--turquoise); background:#F6FCFC}
.scale button:focus-visible{outline:3px solid rgba(0,173,239,.35); outline-offset:2px}
.scale button[aria-pressed="true"]{background:var(--teal); border-color:var(--teal); color:#fff; transform:translateY(-2px)}
.ends{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:16px}
.ends span{
  display:inline-flex; align-items:center; gap:9px; background:var(--light-bg);
  border:1px solid var(--outline); border-radius:999px; padding:8px 16px 8px 9px;
  font-size:15px; font-weight:650; color:var(--slate); letter-spacing:-.005em;
}
.ends span.hi{padding:8px 9px 8px 16px}
.ends b{
  flex:none; width:24px; height:24px; border-radius:50%; background:var(--teal); color:#fff;
  display:grid; place-items:center; font-size:13px; font-weight:700;
}
.sub.scalenote{color:var(--slate); font-weight:650; font-size:15px}
select{
  width:100%; margin-top:24px; padding:16px 44px 16px 16px; font:inherit; font-size:16.5px;
  color:var(--ink); background:#fff; border:1.5px solid var(--outline); border-radius:11px;
  cursor:pointer; -webkit-appearance:none; appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath d='M1 1.5L6 6.5l5-5' fill='none' stroke='%2332515B' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat; background-position:right 16px center; background-size:13px;
}
select:hover{border-color:var(--turquoise)}
select:focus{outline:none; border-color:var(--turquoise); box-shadow:0 0 0 3px rgba(4,174,177,.13)}
select:invalid,select.empty{color:var(--grey)}
textarea{
  width:100%; min-height:150px; resize:vertical; padding:15px 16px; font:inherit; font-size:15.5px;
  line-height:1.55; color:var(--ink); border:1.5px solid var(--outline); border-radius:11px;
  background:var(--digital); margin-top:22px;
}
textarea:focus{outline:none; border-color:var(--turquoise); background:#fff; box-shadow:0 0 0 3px rgba(4,174,177,.13)}
textarea::placeholder{color:var(--grey)}
.follow{margin-top:20px; padding-top:20px; border-top:1px solid var(--outline)}
.follow label{display:block; font-size:14.5px; font-weight:600; color:var(--midnight)}
.follow textarea{min-height:110px; margin-top:10px}
.hint{font-size:13px; color:var(--grey); margin:14px 0 0}
.hint.warn{color:var(--orange)}
footer{
  display:flex; align-items:center; gap:12px; padding:18px 34px 24px; flex:none;
  border-top:1px solid var(--outline); background:var(--digital);
}
.spacer{flex:1}
button.nav{
  font:inherit; font-size:15px; font-weight:600; border-radius:10px; cursor:pointer;
  padding:12px 26px; border:1.5px solid transparent; transition:background .15s,color .15s,border-color .15s;
}
.back{background:transparent; color:var(--grey); border-color:var(--outline)}
.back:hover{color:var(--ink); border-color:var(--grey)}
.next{background:var(--navy); color:#fff}
.next:hover{background:var(--midnight)}
.next:disabled{background:var(--outline); color:var(--grey); cursor:not-allowed}
.next.submit{background:var(--teal)}
.next.submit:hover{background:var(--jungle)}
.kbd{font-size:12.5px; color:var(--grey)}
.kbd b{font-weight:600; color:var(--slate); background:var(--light-bg); border-radius:4px; padding:2px 6px; font-size:11.5px}
.done{padding:70px 34px; text-align:center}
.done .mark{width:62px; height:62px; border-radius:50%; background:#EAF7EC; display:grid; place-items:center; margin:0 auto 22px}
.done h1{margin-bottom:10px}
.done p{font-size:16px; color:var(--grey); margin:0 auto; max-width:440px; line-height:1.6}
.err{margin:18px auto 0; max-width:470px; background:#FDF1F1; border:1px solid #F3D3D3; color:#8F2020; border-radius:10px; padding:14px 16px; font-size:14px; line-height:1.55; text-align:left}
.err button{margin-top:10px; font:inherit; font-size:14px; font-weight:600; background:var(--alert); color:#fff; border:0; border-radius:8px; padding:9px 18px; cursor:pointer}
.demo{margin:18px auto 0; max-width:470px; background:#FFF8EA; border:1px solid #F5E2BC; color:#7A5410; border-radius:10px; padding:13px 16px; font-size:13.5px; line-height:1.55; text-align:left}
.legal{max-width:760px; margin:16px auto 0; font-size:12.5px; color:var(--grey); text-align:center; line-height:1.6; position:relative; z-index:1}
@media (max-width:640px){
  .body{padding:26px 20px 8px}
  footer{padding:15px 20px 20px}
  h1{font-size:21px}
  .kbd{display:none}
  .scale{gap:7px}
  .scale button{font-size:17px}
  .ends{gap:8px}
  .ends span{font-size:13px; padding:6px 12px 6px 7px; gap:7px}
  .ends span.hi{padding:6px 7px 6px 12px}
  .ends b{width:21px; height:21px; font-size:12px}
  .opts.cols{grid-template-columns:1fr 1fr}
  .done{padding:52px 20px}
  header.big{padding-top:28px}
  header.big .head-inner{gap:15px}
  header.big .logo{width:42px; height:47px}
  header.big .brand .ev{font-size:21px}
  header.big .brand .kind{font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

var SURVEY_ID   = "post-event";

var QUESTIONS = [
  {

    "subtitle": "1 = no confidence  ·  5 = high confidence",
    "descriptors": [
      "No confidence — I would avoid or hand off the conversation.",
      "Low confidence — I can talk about AI in general terms, but not tie it to business outcomes.",
      "Moderate confidence — I can hold the conversation, but I struggle when it gets specific or technical.",

var answers = {}, idx = 0, sending = false;
var body = document.getElementById('body'), bar = document.getElementById('bar');
var backBtn = document.getElementById('back'), nextBtn = document.getElementById('next');
var kbd = document.getElementById('kbd');

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function answered(q){
  var v = answers[q.id];
  if (q.type === 'multi') return Array.isArray(v) && v.length > 0;
  if (q.type === 'text')  return true;
  return v !== undefined && v !== null && v !== '';
}

function render(){
  var q = QUESTIONS[idx];
  var h = '<p class="step">Question ' + (idx+1) + ' of ' + QUESTIONS.length + (q.required ? '' : ' &middot; optional') + '</p>';
  h += '<h1>' + esc(q.title) + '</h1>';
  if (q.subtitle) h += '<p class="sub' + (q.type === 'scale_desc' || q.type === 'rating' ? ' scalenote' : '') + '">' + esc(q.subtitle) + '</p>';

  if (q.type === 'choice'){
    h += '<div class="opts' + (q.columns ? ' cols' : '') + '" role="group">';
    q.options.forEach(function(o,i){
      h += '<button type="button" class="opt" data-v="' + esc(o) + '" aria-pressed="' + (answers[q.id]===o) + '">' +
           '<span class="badge">' + (i+1) + '</span><span>' + esc(o) + '</span></button>';
    });
    h += '</div>';
    if (q.followUp){
      var show = answers[q.id] === q.followUp.showWhen;
      h += '<div class="follow" id="follow" style="display:' + (show?'block':'none') + '">' +
           '<label for="fu">' + esc(q.followUp.label) + '</label>' +
           '<textarea id="fu" placeholder="' + esc(q.followUp.placeholder||'') + '">' + esc(answers[q.followUp.id]||'') + '</textarea></div>';
    }
  }
  else if (q.type === 'dropdown'){
    var sv = answers[q.id] || '';
    h += '<select id="sel" class="' + (sv ? '' : 'empty') + '">';
    h += '<option value=""' + (sv ? '' : ' selected') + '>' + esc(q.placeholder || 'Choose one…') + '</option>';
    q.options.forEach(function(o){
      h += '<option value="' + esc(o) + '"' + (sv === o ? ' selected' : '') + '>' + esc(o) + '</option>';
    });
    h += '</select>';
  }
  else if (q.type === 'scale_desc'){
    h += '<div class="opts">';
    q.descriptors.forEach(function(d,i){
      h += '<button type="button" class="opt" data-v="' + (i+1) + '" aria-pressed="' + (answers[q.id]===i+1) + '">' +
           '<span class="badge">' + (i+1) + '</span><span>' + esc(d) + '</span></button>';
    });
    h += '</div>';
  }
  else if (q.type === 'rating'){
    h += '<div class="scalewrap"><div class="scale">';
    for (var n=1; n<=5; n++){
      h += '<button type="button" data-v="' + n + '" aria-label="' + n + ' out of 5" aria-pressed="' + (answers[q.id]===n) + '">' + n + '</button>';
    }
    h += '</div><div class="ends"><span><b>1</b>' + esc(q.low) + '</span><span class="hi">' + esc(q.high) + '<b>5</b></span></div></div>';
  }
  else if (q.type === 'multi'){
    var cur = answers[q.id] || [];
    h += '<div class="opts" role="group">';
    q.options.forEach(function(o){
      h += '<button type="button" class="opt" data-v="' + esc(o) + '" aria-pressed="' + (cur.indexOf(o)>-1) + '">' +
           '<span class="tick"><svg viewBox="0 0 12 12"><path d="M1 6l3.2 3.4L11 2.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
           '<span>' + esc(o) + '</span></button>';
    });
    h += '</div><p class="hint" id="cnt"></p>';
  }
  else if (q.type === 'text'){
    h += '<textarea id="ta" placeholder="' + esc(q.placeholder||'') + '">' + esc(answers[q.id]||'') + '</textarea>';
  }

  body.innerHTML = h;
  bar.style.width = ((idx) / QUESTIONS.length * 100) + '%';
  backBtn.style.visibility = idx === 0 ? 'hidden' : 'visible';
  wire(q);
  syncNav();
  var f = body.querySelector('button.opt, .scale button, select');
  if (f) f.focus({preventScroll:true});
  window.scrollTo(0,0);
}

function wire(q){
  if (q.type === 'choice' || q.type === 'scale_desc'){
    body.querySelectorAll('.opt').forEach(function(b){
      b.onclick = function(){
        var v = q.type === 'scale_desc' ? parseInt(b.dataset.v,10) : b.dataset.v;
        answers[q.id] = v;
        body.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-pressed', x===b); });
        var fu = document.getElementById('follow');
        if (fu){
          var show = v === q.followUp.showWhen;
          fu.style.display = show ? 'block' : 'none';
          if (!show) delete answers[q.followUp.id];
          syncNav();
          if (show) { document.getElementById('fu').focus({preventScroll:true}); return; }
        }
        syncNav();
        if (!q.followUp) setTimeout(advance, 260);
      };
    });
    var fuEl = document.getElementById('fu');
    if (fuEl) fuEl.oninput = function(){ answers[q.followUp.id] = fuEl.value; };
  }
  else if (q.type === 'dropdown'){
    var sel = document.getElementById('sel');
    sel.onchange = function(){
      answers[q.id] = sel.value;
      if (!sel.value) delete answers[q.id];
      sel.classList.toggle('empty', !sel.value);
      syncNav();
    };
  }
  else if (q.type === 'rating'){
    body.querySelectorAll('.scale button').forEach(function(b){
      b.onclick = function(){
        answers[q.id] = parseInt(b.dataset.v,10);
        body.querySelectorAll('.scale button').forEach(function(x){ x.setAttribute('aria-pressed', x===b); });
        syncNav(); setTimeout(advance, 260);
      };
    });
  }
  else if (q.type === 'multi'){
    var upd = function(){
      var cur = answers[q.id] || [];
      var c = document.getElementById('cnt');
      c.textContent = cur.length + ' of ' + q.max + ' selected';
      c.className = 'hint' + (cur.length >= q.max ? ' warn' : '');
      body.querySelectorAll('.opt').forEach(function(x){
        var on = cur.indexOf(x.dataset.v) > -1;
        x.setAttribute('aria-pressed', on);
        x.style.opacity = (!on && cur.length >= q.max) ? '.45' : '1';
      });
    };
    body.querySelectorAll('.opt').forEach(function(b){
      b.onclick = function(){
        var cur = answers[q.id] || [];
        var i = cur.indexOf(b.dataset.v);
        if (i > -1) cur.splice(i,1);
        else { if (cur.length >= q.max) return; cur.push(b.dataset.v); }
        answers[q.id] = cur; upd(); syncNav();
      };
    });
    upd();
  }
  else if (q.type === 'text'){
    var ta = document.getElementById('ta');
    ta.oninput = function(){ answers[q.id] = ta.value; };
  }
}

function syncNav(){
  var q = QUESTIONS[idx], last = idx === QUESTIONS.length - 1;
  nextBtn.textContent = last ? 'Submit' : 'Next';
  nextBtn.classList.toggle('submit', last);
  nextBtn.disabled = q.required && !answered(q);
  if (q.type === 'choice' || q.type === 'scale_desc'){
    var n = (q.options || q.descriptors).length;
    kbd.innerHTML = 'Press <b>1</b>–<b>' + n + '</b> to choose';
  } else if (q.type === 'rating'){
    kbd.innerHTML = 'Press <b>1</b>–<b>5</b> to rate';
  } else {
    kbd.innerHTML = q.required ? '' : 'Leave blank to skip';
  }
}

function advance(){
  var q = QUESTIONS[idx];
  if (q.required && !answered(q)) return;
  if (idx === QUESTIONS.length - 1) submit();
  else { idx++; render(); }
}

nextBtn.onclick = advance;
backBtn.onclick = function(){ if (idx > 0){ idx--; render(); } };

document.addEventListener('keydown', function(e){
  if (sending) return;
  var q = QUESTIONS[idx], tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'select'){
    if (e.key === 'Enter'){ e.preventDefault(); advance(); }
    return;
  }
  if (tag === 'textarea'){
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); advance(); }
    return;
  }
  if (/^[1-9]$/.test(e.key)){
    var list = body.querySelectorAll('.opt, .scale button');
    var t = list[parseInt(e.key,10) - 1];
    if (t){ e.preventDefault(); t.click(); }
  } else if (e.key === 'Enter'){
    e.preventDefault(); advance();
  }
});

function payload(){
  var responses = QUESTIONS.map(function(q){
    var o = { id:q.id, question:q.title, type:q.type, answer: answers[q.id] === undefined ? null : answers[q.id] };
    if (q.followUp) o.followUp = { id:q.followUp.id, question:q.followUp.label, answer: answers[q.followUp.id] || null };
    return o;
  });
  var flat = {};
  responses.forEach(function(r){
    flat[r.id] = r.answer;
    if (r.followUp) flat[r.followUp.id] = r.followUp.answer;
  });
  return {
    survey: SURVEY_ID,
    surveyTitle: "AI & MCP Day — Post-Event Survey",
    submittedAt: new Date().toISOString(),
    timezoneOffsetMinutes: new Date().getTimezoneOffset(),
    anonymous: true,
    answers: flat,
    responses: responses
  };
}

function thanks(demo){
  document.querySelector('.bar').style.display = 'none';
  document.querySelector('footer').style.display = 'none';
  bar.style.width = '100%';
  body.className = 'done';
  body.innerHTML =
    '<div class="mark"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#1AB92D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>' +
    '<h1>Thank you</h1><p>Your feedback goes straight to the team planning the next one. We appreciate you taking the time.</p>' +
    (demo ? '<div class="demo"><b>Demo mode.</b> No webhook is configured yet, so nothing was sent. The payload has been logged to the browser console. Set <code>WEBHOOK_URL</code> near the top of this file to go live.</div>' : '');
  window.scrollTo(0,0);
}

function submit(){
  if (sending) return;
  var data = payload();
  if (WEBHOOK_URL.indexOf('REPLACE-ME') > -1){
    console.log('[' + SURVEY_ID + '] demo mode — payload not sent:', data);
    console.log(JSON.stringify(data, null, 2));
    thanks(true);
    return;
  }
  sending = true;
  nextBtn.disabled = true;
  nextBtn.textContent = 'Sending…';
  fetch(WEBHOOK_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  }).then(function(r){
    if (!r.ok) throw new Error('The server replied ' + r.status + ' ' + r.statusText + '.');
    sending = false; thanks(false);
  }).catch(function(err){
    sending = false;
    nextBtn.disabled = false;
    nextBtn.textContent = 'Submit';
    var old = document.querySelector('.err'); if (old) old.remove();
    var d = document.createElement('div');
    d.className = 'err';
    d.innerHTML = '<b>We could not send your response.</b><br>' + esc(err.message) +
      ' Your answers are still here — try again, and if it keeps failing let the organisers know.' +
      '<br><button type="button" id="retry">Try again</button>';
    body.appendChild(d);
    document.getElementById('retry').onclick = function(){ d.remove(); submit(); };
    d.scrollIntoView({behavior:'smooth', block:'center'});
  });
}

window.addEventListener('beforeunload', function(e){
  if (Object.keys(answers).length && body.className !== 'done'){ e.preventDefault(); e.returnValue = ''; }
});

/* ----------------------------------------------------------------
   Sync Question 1's location options to the live AIAssuranceLab-Classes
   table instead of this file's own hardcoded list (added 2026-11-11 -
   see survey-forms/README.md in the app repo). REPLACES the hardcoded
   list entirely on success - only falls back to the hardcoded options
   already in QUESTIONS[0] above if the fetch fails, times out, or
   returns no locations, so the form never breaks if the platform is
   unreachable. 2.5s timeout: this must never visibly delay the survey.
---------------------------------------------------------------- */
(function syncLocationsThenRender(){
  var eventQ = QUESTIONS.find(function(q){ return q.id === 'event'; });
  var controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = setTimeout(function(){ if (controller) controller.abort(); }, 2500);
  fetch('/api/survey/locations', { signal: controller ? controller.signal : undefined })
    .then(function(r){ return r.ok ? r.json() : Promise.reject(new Error('bad status')); })
    .then(function(data){
      clearTimeout(timer);
      if (eventQ && Array.isArray(data.locations) && data.locations.length > 0) {
        eventQ.options = data.locations;
      }
    })
    .catch(function(){
      clearTimeout(timer);
      // Network error, timeout, or bad response - keep the hardcoded
      // fallback list already in QUESTIONS[0] untouched.
    })
    .finally(function(){ render(); });
})();
</script>
